name: Sync RSSHub upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream without merge commits
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/DIYgod/RSSHub.git
          git fetch upstream master

          # Save this workflow, then make the working tree exactly match upstream.
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml
          git reset --hard upstream/master
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/sync-upstream.yml
          git commit -m "ci: keep automatic upstream sync" || true
          git push --force-with-lease origin HEAD:master
